<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}😈 Evil Site{% endblock %}</title>
    <style>
      body {
        font-family: -apple-system, "Hiragino Sans", sans-serif;
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 16px;
        background: #1f2937;
        color: #f9fafb;
      }
      a {
        color: #93c5fd;
      }
      .card {
        background: #111827;
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 16px 20px;
        margin-bottom: 12px;
      }
      .warn {
        background: #7f1d1d;
        border-left: 4px solid #f87171;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 14px;
      }
      code,
      pre {
        background: #0b1220;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 13px;
        color: #fde68a;
      }
      pre {
        padding: 12px;
        overflow-x: auto;
      }
      h1 small {
        font-size: 14px;
        color: #9ca3af;
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <h1>😈 Evil Site <small>(attacker-backend)</small></h1>
    <p class="warn">
      ⚠️ このサイトは CSRF 攻撃の学習用です。被害者サイト (<a href="{{ victim_frontend_base }}"
        >{{ victim_frontend_base }}</a
      >) に ログイン中のブラウザでアクセスすると、被害者の口座から送金が行われます。
    </p>
    {% block content %}{% endblock %}
  </body>
</html>
